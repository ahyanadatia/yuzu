<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101112">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Yuzu">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='96 68 486 408'%3E%3Crect x='96' y='68' width='486' height='408' rx='90' fill='%23101112'/%3E%3Cg fill='%23F5E447' transform='translate(339 272) scale(.78) translate(-339 -272)'%3E%3Cpolygon points='140,92 275,123 333,238 203,205'/%3E%3Cpolygon points='538,92 407,123 345,238 473,205'/%3E%3Cpolygon points='340,245 388,312 340,452 290,312'/%3E%3C/g%3E%3C/svg%3E">
<title>Yuzu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;1,700;1,800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: one phone-width scoreboard column, fixed three-tab bar, big italic condensed numerals */
  --ink:#101112; --graphite:#2A2D31; --chalk:#F5F5F0; --yellow:#F5E447; --red:#FF6B4A;
  --mute:#A3A5A0; --line:#3B3E44;
  --display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--chalk);font:400 16px/1.45 var(--body);-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
.app{max-width:520px;margin:0 auto;padding:0 16px 96px;display:flex;flex-direction:column;gap:16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0 4px}
.brand{display:flex;align-items:center;gap:8px}
.brand svg{width:30px;height:28px}
.wm{font:italic 800 34px/1 var(--display);letter-spacing:.01em}
.wk{text-align:right;font:600 15px/1.15 var(--display);letter-spacing:.06em;text-transform:uppercase}
.wk small{display:block;color:var(--mute);font-size:13px}
.view{display:flex;flex-direction:column;gap:14px}
.card{background:var(--graphite);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.eyebrow{font:600 13px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
h2{font:italic 800 30px/1 var(--display);text-wrap:balance}
h3{font:600 18px/1.25 var(--body);text-wrap:balance;overflow-wrap:anywhere}
.mute{color:var(--mute)} .small{font-size:14px}
.note{border:1px dashed var(--line);border-radius:12px;padding:10px 12px;font-size:14px;color:var(--mute)}
.note b{color:var(--chalk)}

/* standing strip */
.stand{display:flex;gap:16px;align-items:center}
.stand svg{width:84px;height:78px;flex:none}
.big{font:italic 800 56px/.9 var(--display);font-variant-numeric:tabular-nums}
.big small{font:italic 700 22px/1 var(--display);color:var(--mute)}
.stand p{font-size:14px;color:var(--mute)}
.stand p b{color:var(--chalk);font-weight:600}

/* goals */
.gh{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.tag{font:600 12px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--line);border-radius:99px;padding:5px 9px;color:var(--chalk)}
.kind{font:600 13px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.proof{font-size:14px;color:var(--mute);overflow-wrap:anywhere}
.targets{display:flex;flex-direction:column;gap:4px;font-size:14px}
.targets b{font:700 13px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;margin-right:6px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{appearance:none;border:0;border-radius:12px;min-height:48px;padding:0 18px;background:var(--yellow);color:var(--ink);font:700 18px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;flex:1 1 auto}
.btn span{font-weight:600;opacity:.7}
.btn.ghost{background:transparent;color:var(--chalk);border:1.5px solid var(--line)}
.btn.danger{background:transparent;color:var(--red);border:1.5px solid var(--red)}
.btn.sm{min-height:40px;font-size:15px;flex:0 0 auto;padding:0 14px}
.btn:disabled{opacity:.5;cursor:default}
.link{appearance:none;background:none;border:0;padding:8px 0;color:var(--chalk);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:14px}
:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
.state{display:inline-flex;align-items:center;gap:6px;font:700 15px/1 var(--display);letter-spacing:.08em;text-transform:uppercase}
.state.ok::before{content:"";width:9px;height:14px;border:solid var(--yellow);border-width:0 3px 3px 0;transform:rotate(45deg) translate(-2px,-2px)}
.state.wait{color:var(--mute)} .state.bad{color:var(--red)}
.thumb{width:64px;height:64px;border-radius:10px;object-fit:cover;background:var(--ink);flex:none;cursor:zoom-in;border:0;padding:0;display:block}
.thumb.ph,.shot.ph{display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--mute);text-align:center;cursor:default}
.shot{width:100%;max-height:340px;object-fit:cover;border-radius:10px;background:var(--ink);cursor:zoom-in;display:block;min-height:120px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}

/* forms */
form{display:flex;flex-direction:column;gap:12px}
fieldset{border:0;border-top:1px solid var(--line);margin:0;padding:12px 0 0;display:flex;flex-direction:column;gap:8px;min-width:0}
legend{font:700 16px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;padding:0 8px 0 0}
label{font-size:13px;color:var(--mute);display:flex;flex-direction:column;gap:4px;min-width:0}
.row>label{flex:1 1 120px}
form.row{flex-direction:row;align-items:flex-end}
input[type=text],input[type=number],select{width:100%;min-height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--ink);padding:0 12px;font-size:16px;color:var(--chalk)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{appearance:none;border:1px solid var(--line);background:none;border-radius:99px;padding:7px 11px;font-size:13px;cursor:pointer;color:var(--chalk)}
.err{color:var(--red);font-size:14px;min-height:0}
label.btn{flex-direction:row;position:relative}
label.link{flex-direction:row;display:inline-flex}
.vh{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
label:focus-within:has(.vh){outline:2px solid var(--yellow);outline-offset:2px}
label.check{flex-direction:row;align-items:center;gap:10px;font-size:15px;color:var(--chalk);flex:1 1 auto}
label.check input{width:22px;height:22px;accent-color:var(--yellow);flex:none}
.sec{font:700 15px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-top:6px}
.goal{gap:8px}
.goal .line{display:flex;gap:12px;align-items:center}
.goal .line>div{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.typed{font-size:14px;color:var(--chalk)}
.typed b{font:700 18px/1 var(--display);letter-spacing:.02em}
.wins{font:700 11px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;border-radius:4px;padding:3px 6px;flex:none;background:var(--yellow);color:var(--ink)}
.feed .shot{max-height:260px}
.rules{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:15px;color:var(--mute)}
.rules b{color:var(--chalk);font-weight:600}
.track{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:14px}
.track li{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.track li>span:first-child{min-width:0;overflow-wrap:anywhere}
.parts{display:flex;gap:6px;flex-wrap:wrap}
.part{font:600 13px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);border-radius:6px;padding:5px 7px;color:var(--mute);font-variant-numeric:tabular-nums}
.part b{color:var(--chalk)}
.checklist{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:14px}
.checklist li{display:flex;gap:8px;align-items:baseline;color:var(--mute)}
.checklist li.done{color:var(--chalk)}
.checklist li::before{content:"○";flex:none}
.checklist li.done::before{content:"●";color:var(--yellow)}

/* season bar */
.bar{height:12px;border-radius:99px;background:var(--ink);overflow:hidden}
.bar i{display:block;height:100%;background:var(--yellow);border-radius:99px}
.barlab{display:flex;justify-content:space-between;font:600 14px/1 var(--display);letter-spacing:.06em;font-variant-numeric:tabular-nums;color:var(--mute)}
.barlab b{color:var(--chalk)}

/* inbox */
.who{display:flex;align-items:center;gap:8px;font-size:14px;flex-wrap:wrap}
.who>span:not(.av):not(.kind){flex:1;min-width:0}
.who b{font-weight:600}
.av{width:28px;height:28px;border-radius:50%;object-fit:cover;flex:none;background:var(--line);display:inline-flex;align-items:center;justify-content:center;font:700 14px/1 var(--display);color:var(--chalk)}

/* leaderboard */
.seg{display:flex;background:var(--graphite);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;appearance:none;border:0;background:none;border-radius:9px;min-height:40px;font:700 16px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--chalk);color:var(--ink)}
.table{display:flex;flex-direction:column;gap:6px}
.lrow{background:var(--graphite);border-radius:12px;overflow:hidden}
.lrow>button{appearance:none;border:0;background:none;width:100%;display:grid;grid-template-columns:38px 1fr auto;gap:10px;align-items:center;padding:10px 14px 10px 10px;text-align:left;cursor:pointer;color:inherit}
.rk{font:italic 800 38px/1 var(--display);text-align:center;font-variant-numeric:tabular-nums}
.first .rk,.first .pts{color:var(--yellow)}
.nm{min-width:0;display:flex;flex-direction:column;gap:6px}
.nm .n1{display:flex;align-items:center;gap:8px;font-weight:600;min-width:0}
.nm .n1 span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dots{display:flex;gap:4px;align-items:center}
.dot{width:12px;height:12px;border-radius:3px;background:var(--ink);transform:skewX(-12deg)}
.dot.h{background:linear-gradient(90deg,var(--chalk) 50%,var(--ink) 50%)}
.dot.f{background:var(--chalk)}
.dot.today{outline:1px solid var(--mute);outline-offset:1px}
.wkm{font:700 12px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-left:4px}
.pts{font:italic 800 34px/1 var(--display);font-variant-numeric:tabular-nums;text-align:right}
.pts small{display:block;font:600 12px/1.2 var(--display);letter-spacing:.08em;color:var(--mute);font-style:normal}
.flag{font:700 11px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;border-radius:4px;padding:3px 6px;flex:none}
.detail{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:12px}
.detail h3{font-size:15px}
.safeline{display:flex;align-items:center;gap:8px;font:600 12px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.safeline::before,.safeline::after{content:"";flex:1;border-top:1px dashed var(--line)}
.show{border:1.5px solid var(--yellow);background:none}
.show li{margin:2px 0}
.show ul{margin:0;padding-left:18px}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(16,17,18,.96);border-top:1px solid var(--line);display:flex;justify-content:center}
.tabs div{display:flex;width:100%;max-width:520px}
.tabs button{flex:1;appearance:none;background:none;border:0;min-height:60px;font:700 15px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--mute);cursor:pointer;position:relative}
.tabs button[aria-current=page]{color:var(--chalk)}
.tabs button[aria-current=page]::after{content:"";position:absolute;left:30%;right:30%;top:0;height:3px;background:var(--yellow)}
.badge{display:inline-block;min-width:20px;padding:3px 6px;border-radius:99px;background:var(--yellow);color:var(--ink);font-size:13px;margin-left:6px;letter-spacing:0}
.toast{position:fixed;left:16px;right:16px;bottom:76px;max-width:488px;margin:0 auto;background:var(--chalk);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:14px;font-weight:500;display:none}
.toast.on{display:block}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;padding:16px;cursor:zoom-out;border:0}
.zoom.on{display:flex}
.zoom img{max-width:100%;max-height:100%;border-radius:8px}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .4s}.seg i{transition:fill .3s}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand" aria-label="Yuzu">
      <svg viewBox="136 88 406 368" aria-hidden="true"><g fill="#F5E447"><polygon points="140,92 275,123 333,238 203,205"/><polygon points="538,92 407,123 345,238 473,205"/><polygon points="340,245 388,312 340,452 290,312"/></g></svg>
      <span class="wm">YUZU</span>
    </div>
    <div class="wk" id="wk"></div>
  </header>
  <main class="view" id="view"><div class="card"><p class="eyebrow">Earn your rank.</p><p class="mute">Loading the league…</p></div></main>
</div>
<nav class="tabs" aria-label="Screens"><div id="tabs"></div></nav>
<div class="toast" id="toast" role="status"></div>
<button class="zoom" id="zoom" aria-label="Close photo"><img id="zoomImg" alt="Proof photo, full size"></button>
<script>
