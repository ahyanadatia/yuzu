<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101112">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Yuzu">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='96 68 486 408'%3E%3Crect x='96' y='68' width='486' height='408' rx='90' fill='%23101112'/%3E%3Cg fill='%23F5E447' transform='translate(339 272) scale(.78) translate(-339 -272)'%3E%3Cpolygon points='140,92 275,123 333,238 203,205'/%3E%3Cpolygon points='538,92 407,123 345,238 473,205'/%3E%3Cpolygon points='340,245 388,312 340,452 290,312'/%3E%3C/g%3E%3C/svg%3E">
<title>Yuzu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;1,700;1,800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: one phone-width scoreboard column, fixed three-tab bar, big italic condensed numerals */
  --ink:#101112; --graphite:#2A2D31; --chalk:#F5F5F0; --yellow:#F5E447; --red:#FF6B4A;
  --mute:#A3A5A0; --line:#3B3E44;
  --display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--chalk);font:400 16px/1.45 var(--body);-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
.app{max-width:520px;margin:0 auto;padding:0 16px 110px;display:flex;flex-direction:column;gap:16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0 4px}
.brand{display:flex;align-items:center;gap:8px}
.brand svg{width:30px;height:28px}
.wm{font:italic 800 34px/1 var(--display);letter-spacing:.01em}
.wk{text-align:right;font:600 15px/1.15 var(--display);letter-spacing:.06em;text-transform:uppercase}
.wk small{display:block;color:var(--mute);font-size:13px}
.view{display:flex;flex-direction:column;gap:14px}
.card{background:var(--graphite);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.eyebrow{font:600 13px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
h2{font:italic 800 30px/1 var(--display);text-wrap:balance}
h3{font:600 18px/1.25 var(--body);text-wrap:balance;overflow-wrap:anywhere}
.mute{color:var(--mute)} .small{font-size:14px}
.note{border:1px dashed var(--line);border-radius:12px;padding:10px 12px;font-size:14px;color:var(--mute)}
.note b{color:var(--chalk)}

/* standing strip */
.stand{display:flex;gap:16px;align-items:center}
.stand svg{width:84px;height:78px;flex:none}
.big{font:italic 800 56px/.9 var(--display);font-variant-numeric:tabular-nums}
.big small{font:italic 700 22px/1 var(--display);color:var(--mute)}
.stand p{font-size:14px;color:var(--mute)}
.stand p b{color:var(--chalk);font-weight:600}

/* goals */
.gh{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.tag{font:600 12px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--line);border-radius:99px;padding:5px 9px;color:var(--chalk)}
.kind{font:600 13px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.proof{font-size:14px;color:var(--mute);overflow-wrap:anywhere}
.targets{display:flex;flex-direction:column;gap:4px;font-size:14px}
.targets b{font:700 13px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;margin-right:6px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{appearance:none;border:0;border-radius:12px;min-height:48px;padding:0 18px;background:var(--yellow);color:var(--ink);font:700 18px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;flex:1 1 auto}
.btn span{font-weight:600;opacity:.7}
.btn.ghost{background:transparent;color:var(--chalk);border:1.5px solid var(--line)}
.btn.danger{background:transparent;color:var(--red);border:1.5px solid var(--red)}
.btn.sm{min-height:40px;font-size:15px;flex:0 0 auto;padding:0 14px}
.btn:disabled{opacity:.5;cursor:default}
.link{appearance:none;background:none;border:0;padding:8px 0;color:var(--chalk);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:14px}
:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
.state{display:inline-flex;align-items:center;gap:6px;font:700 15px/1 var(--display);letter-spacing:.08em;text-transform:uppercase}
.state.ok::before{content:"";width:9px;height:14px;border:solid var(--yellow);border-width:0 3px 3px 0;transform:rotate(45deg) translate(-2px,-2px)}
.state.wait{color:var(--mute)} .state.bad{color:var(--red)}
.thumb{width:64px;height:64px;border-radius:10px;object-fit:cover;background:var(--ink);flex:none;cursor:zoom-in;border:0;padding:0;display:block}
.thumb.ph,.shot.ph{display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--mute);text-align:center;cursor:default}
.shot{width:100%;max-height:340px;object-fit:cover;border-radius:10px;background:var(--ink);cursor:zoom-in;display:block;min-height:120px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}

/* forms */
form{display:flex;flex-direction:column;gap:12px}
fieldset{border:0;border-top:1px solid var(--line);margin:0;padding:12px 0 0;display:flex;flex-direction:column;gap:8px;min-width:0}
legend{font:700 16px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;padding:0 8px 0 0}
label{font-size:13px;color:var(--mute);display:flex;flex-direction:column;gap:4px;min-width:0}
.row>label{flex:1 1 120px}
form.row{flex-direction:row;align-items:flex-end}
input[type=text],input[type=number],input[type=tel],input[type=password],select{width:100%;min-height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--ink);padding:0 12px;font-size:16px;color:var(--chalk)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{appearance:none;border:1px solid var(--line);background:none;border-radius:99px;padding:7px 11px;font-size:13px;cursor:pointer;color:var(--chalk)}
.err{color:var(--red);font-size:14px;min-height:0}
label.btn{flex-direction:row;position:relative}
label.link{flex-direction:row;display:inline-flex}
.vh{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
label:focus-within:has(.vh){outline:2px solid var(--yellow);outline-offset:2px}
label.check{flex-direction:row;align-items:center;gap:10px;font-size:15px;color:var(--chalk);flex:1 1 auto}
label.check input{width:22px;height:22px;accent-color:var(--yellow);flex:none}
.sec{font:700 15px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-top:6px}
.goal{gap:8px}
.goal .line{display:flex;gap:12px;align-items:center}
.goal .line>div{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.typed{font-size:14px;color:var(--chalk)}
.typed b{font:700 18px/1 var(--display);letter-spacing:.02em}
.wins{font:700 11px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;border-radius:4px;padding:3px 6px;flex:none;background:var(--yellow);color:var(--ink)}
.feed .shot{max-height:260px}
.rules{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:15px;color:var(--mute)}
.rules b{color:var(--chalk);font-weight:600}
.track{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:14px}
.track li{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.track li>span:first-child{min-width:0;overflow-wrap:anywhere}
.parts{display:flex;gap:6px;flex-wrap:wrap}
.part{font:600 13px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);border-radius:6px;padding:5px 7px;color:var(--mute);font-variant-numeric:tabular-nums}
.part b{color:var(--chalk)}
.checklist{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:14px}
.checklist li{display:flex;gap:8px;align-items:baseline;color:var(--mute)}
.checklist li.done{color:var(--chalk)}
.checklist li::before{content:"○";flex:none}
.checklist li.done::before{content:"●";color:var(--yellow)}

/* season bar */
.bar{height:12px;border-radius:99px;background:var(--ink);overflow:hidden}
.bar i{display:block;height:100%;background:var(--yellow);border-radius:99px}
.barlab{display:flex;justify-content:space-between;font:600 14px/1 var(--display);letter-spacing:.06em;font-variant-numeric:tabular-nums;color:var(--mute)}
.barlab b{color:var(--chalk)}

/* inbox */
.who{display:flex;align-items:center;gap:8px;font-size:14px;flex-wrap:wrap}
.who>span:not(.av):not(.kind){flex:1;min-width:0}
.who b{font-weight:600}
.av{width:28px;height:28px;border-radius:50%;object-fit:cover;flex:none;background:var(--line);display:inline-flex;align-items:center;justify-content:center;font:700 14px/1 var(--display);color:var(--chalk)}

/* leaderboard */
.seg{display:flex;background:var(--graphite);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;appearance:none;border:0;background:none;border-radius:9px;min-height:40px;font:700 16px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--chalk);color:var(--ink)}
.table{display:flex;flex-direction:column;gap:6px}
.lrow{background:var(--graphite);border-radius:12px;overflow:hidden}
.lrow>button{appearance:none;border:0;background:none;width:100%;display:grid;grid-template-columns:38px 1fr auto;gap:10px;align-items:center;padding:10px 14px 10px 10px;text-align:left;cursor:pointer;color:inherit}
.rk{font:italic 800 38px/1 var(--display);text-align:center;font-variant-numeric:tabular-nums}
.first .rk,.first .pts{color:var(--yellow)}
.nm{min-width:0;display:flex;flex-direction:column;gap:6px}
.nm .n1{display:flex;align-items:center;gap:8px;font-weight:600;min-width:0}
.nm .n1 span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dots{display:flex;gap:4px;align-items:center}
.dot{width:12px;height:12px;border-radius:3px;background:var(--ink);transform:skewX(-12deg)}
.dot.h{background:linear-gradient(90deg,var(--chalk) 50%,var(--ink) 50%)}
.dot.f{background:var(--chalk)}
.dot.today{outline:1px solid var(--mute);outline-offset:1px}
.wkm{font:700 12px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-left:4px}
.pts{font:italic 800 34px/1 var(--display);font-variant-numeric:tabular-nums;text-align:right}
.pts small{display:block;font:600 12px/1.2 var(--display);letter-spacing:.08em;color:var(--mute);font-style:normal}
.flag{font:700 11px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;border-radius:4px;padding:3px 6px;flex:none}
.detail{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:12px}
.detail h3{font-size:15px}
.safeline{display:flex;align-items:center;gap:8px;font:600 12px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.safeline::before,.safeline::after{content:"";flex:1;border-top:1px dashed var(--line)}
.show{border:1.5px solid var(--yellow);background:none}
.show li{margin:2px 0}
.show ul{margin:0;padding-left:18px}

/* side rail */
.rail{position:fixed;left:0;top:0;bottom:0;width:64px;background:#17181A;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:14px;z-index:5}
.rail .mk{width:34px;height:31px;margin-bottom:4px}
.rail .mk polygon{transform-box:fill-box;transform-origin:center}
.rail nav{position:relative;display:flex;flex-direction:column;width:100%}
.rail .ind{position:absolute;left:0;top:10px;width:4px;height:44px;background:var(--yellow);border-radius:0 4px 4px 0;transform:translateY(calc(var(--i,0) * 64px));box-shadow:0 0 14px rgba(245,228,71,.55)}
.rail button{appearance:none;background:none;border:0;height:64px;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:var(--mute);cursor:pointer;position:relative;font:700 11px/1 var(--display);letter-spacing:.1em;text-transform:uppercase}
.rail button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:square;stroke-linejoin:miter}
.rail button[aria-current=page]{color:var(--chalk)}
.rail button[aria-current=page] svg{color:var(--yellow)}
.rail .badge{position:absolute;top:8px;right:9px;margin:0;min-width:18px;padding:2px 5px;font-size:11px}
.rail .badge:empty{display:none}
body.noside .rail{display:none}
body:not(.noside) .brand svg{display:none}
body:not(.noside) .app{margin-left:64px;max-width:none}
body:not(.noside) .app>*{width:100%;max-width:520px;margin-left:auto;margin-right:auto}
.badge{display:inline-block;min-width:20px;padding:3px 6px;border-radius:99px;background:var(--yellow);color:var(--ink);font-size:13px;margin-left:6px;letter-spacing:0;text-align:center}

/* the yuzu */
.yz{display:block;overflow:visible}
.hero{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 2px}
.hero .yz{width:104px;height:104px}
.hero .sh{width:70px;height:10px;border-radius:50%;background:#000;opacity:.45}

/* locked-in moment */
.pop{position:fixed;inset:0;z-index:20;background:rgba(16,17,18,.92);display:flex;align-items:center;justify-content:center;pointer-events:none}
.pop-in{position:relative;width:220px;height:260px;display:flex;flex-direction:column;align-items:center}
.pop .yz,.pop-mark{position:absolute;left:50%;top:20px;width:150px;height:150px;margin-left:-75px}
.pop-mark{opacity:0}
.pop .drop{position:absolute;left:50%;top:95px;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50% 50% 50% 0;background:var(--yellow);opacity:0}
.pop-text{position:absolute;top:186px;left:-60px;right:-60px;text-align:center;font:italic 800 34px/1.05 var(--display);opacity:0;text-wrap:balance}

@media (prefers-reduced-motion:no-preference){
  .rail .ind{transition:transform .38s cubic-bezier(.3,1.4,.5,1)}
  .rail button svg{transition:transform .2s,color .2s}
  .rail button:active svg{transform:scale(.85)}
  .rail button[aria-current=page] svg{animation:nudge .4s}
  .rail .mk polygon{animation:seg 5s ease-in-out infinite}
  .rail .mk polygon:nth-child(2){animation-delay:.25s}.rail .mk polygon:nth-child(3){animation-delay:.5s}
  .view.enter>*{animation:rise .42s cubic-bezier(.2,.8,.3,1) both}
  .view.enter>*:nth-child(2){animation-delay:.05s}.view.enter>*:nth-child(3){animation-delay:.1s}.view.enter>*:nth-child(4){animation-delay:.15s}.view.enter>*:nth-child(5){animation-delay:.2s}.view.enter>*:nth-child(n+6){animation-delay:.25s}
  .view.enter .bar i{animation:grow .7s .2s cubic-bezier(.2,.8,.3,1) both;transform-origin:left}
  .view.enter .big{animation:punch .5s .1s both}
  .state.ok::before{animation:tick .3s both}
  .hero .yz{animation:bob 2.6s ease-in-out infinite}
  .hero .sh{animation:shadow 2.6s ease-in-out infinite}
  .yz .leaf{transform-box:fill-box;transform-origin:0% 100%;animation:sway 2.6s ease-in-out infinite}
  .yz .shine{animation:shine 2.6s ease-in-out infinite}
  .pop{animation:popbg 2.1s both}
  .pop .yz{animation:drop 2.1s cubic-bezier(.3,.7,.4,1) both}
  .pop-mark{animation:burst 2.1s both}
  .pop .drop{animation:spray 2.1s both}
  .pop-text{animation:say 2.1s both}
}
@keyframes nudge{0%{transform:translateX(-6px)}60%{transform:translateX(3px)}100%{transform:none}}
@keyframes seg{0%,86%,100%{transform:none}92%{transform:scale(1.14)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:none}}
@keyframes punch{0%{transform:scale(.9)}60%{transform:scale(1.06)}100%{transform:none}}
@keyframes tick{from{opacity:0;transform:rotate(45deg) translate(-2px,-2px) scale(.3)}to{opacity:1;transform:rotate(45deg) translate(-2px,-2px)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-10px) rotate(3deg)}}
@keyframes shadow{0%,100%{transform:scaleX(1);opacity:.45}50%{transform:scaleX(.78);opacity:.28}}
@keyframes sway{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(10deg)}}
@keyframes shine{0%,100%{opacity:.75}50%{opacity:.35}}
@keyframes popbg{0%{opacity:0}8%,86%{opacity:1}100%{opacity:0}}
@keyframes drop{0%{transform:translateY(-70vh) rotate(-40deg)}22%{transform:translateY(0) rotate(0) scale(1.18,.8)}30%{transform:translateY(-34px) scale(.94,1.08)}38%{transform:translateY(0) scale(1.1,.9)}44%{transform:scale(1)}52%{transform:scale(.9) rotate(-8deg)}58%{transform:scale(1.35);opacity:1}62%,100%{transform:scale(1.7);opacity:0}}
@keyframes burst{0%,57%{opacity:0;transform:scale(.2) rotate(-25deg)}66%{opacity:1;transform:scale(1.16) rotate(4deg)}74%,100%{opacity:1;transform:none}}
@keyframes spray{0%,57%{opacity:0;transform:rotate(var(--a)) translateY(0) scale(.4)}60%{opacity:1}80%{opacity:1;transform:rotate(var(--a)) translateY(-112px) scale(1)}90%,100%{opacity:0;transform:rotate(var(--a)) translateY(-128px) scale(.5)}}
@keyframes say{0%,64%{opacity:0;transform:translateY(14px)}76%,100%{opacity:1;transform:none}}
.toast{position:fixed;left:80px;right:16px;top:14px;max-width:488px;margin:0 auto;z-index:15;box-shadow:0 8px 30px rgba(0,0,0,.5);background:var(--chalk);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:14px;font-weight:500;display:none}
.toast.on{display:block}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;padding:16px;cursor:zoom-out;border:0}
.zoom.on{display:flex}
.zoom img{max-width:100%;max-height:100%;border-radius:8px}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .4s}.seg i{transition:fill .3s}}
</style>
</head>
<body class="noside">
<div class="app">
  <header class="top">
    <div class="brand" aria-label="Yuzu">
      <svg viewBox="136 88 406 368" aria-hidden="true"><g fill="#F5E447"><polygon points="140,92 275,123 333,238 203,205"/><polygon points="538,92 407,123 345,238 473,205"/><polygon points="340,245 388,312 340,452 290,312"/></g></svg>
      <span class="wm">YUZU</span>
    </div>
    <div class="wk" id="wk"></div>
  </header>
  <main class="view" id="view"><div class="card"><p class="eyebrow">Earn your rank.</p><p class="mute">Loading the league…</p></div></main>
</div>
<aside class="rail" aria-label="Yuzu">
  <svg class="mk" viewBox="136 88 406 368" aria-hidden="true"><g fill="#F5E447"><polygon points="140,92 275,123 333,238 203,205"/><polygon points="538,92 407,123 345,238 473,205"/><polygon points="340,245 388,312 340,452 290,312"/></g></svg>
  <nav id="rail" aria-label="Screens">
    <i class="ind" id="ind"></i>
    <button data-act="tab" data-v="today"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v16H4z"/><path d="M8 12.5l3 3 5-6.5"/></svg>Today</button>
    <button data-act="tab" data-v="feed"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v7H4z"/><path d="M4 15h16M4 20h10"/></svg>Feed<span class="badge" id="feedBadge"></span></button>
    <button data-act="tab" data-v="board"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 21V11h6v10M9 21V4h6v17M15 21v-7h6v7"/></svg>League</button>
    <button data-act="tab" data-v="rules"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18H6z"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>Rules</button>
  </nav>
</aside>
<div class="toast" id="toast" role="status"></div>
<button class="zoom" id="zoom" aria-label="Close photo"><img id="zoomImg" alt="Proof photo, full size"></button>
<script>
/* ---------- core: time, review status, scoring (pure) ---------- */
const H = 3600e3, DAY = 24 * H, SEASON_WEEKS = 8, MIN_CATS = 3;
const pad = n => String(n).padStart(2, '0');
const fmt = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parse = s => { const [a, b, c] = s.split('-').map(Number); return new Date(a, b - 1, c); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return fmt(d); };

  editGoal(d) { const goals = eff(S.me, curWeek()), i = goals.findIndex(g => g.id === d.g); if (i < 0) return; const g = goals[i], m = g.m || {}, fresh = g.type === 's' && g.sid !== seasonInfo().id; openEdit(i, { type: g.type, title: g.title, cat: g.cat, proof: g.proof, std: g.std, str: g.str, ml: m.l, mu: m.u, mo: m.op, mt: m.t, up: g.up, base: fresh ? '' : g.base, target: fresh ? '' : g.target, unit: g.unit }); },
  cancelEdit() { S.edit = null; clearDraft('e_'); render(true); },
  rmGoal() { const goals = clone(eff(S.me, curWeek())); goals.splice(S.edit.i, 1); S.edit = null; clearDraft('e_'); saveGoals(goals); toast('Goal removed.'); },
  tick(d) {
    const w = curWeek(), day = gameDay(now()), g = eff(S.me, w).find(x => x.id === d.g); if (!g) return;
    let v = true;
    if (g.m) { v = parseFloat(($('v_' + g.id) || {}).value); if (isNaN(v)) return toast('Type your ' + g.m.l.toLowerCase() + ' number first.'); }
    clearDraft('v_' + g.id); saveWeek(w, pinned(w, { days: { [day]: { ticks: { [g.id]: v } } } }));
    if (!metV(g, v)) toast('Logged, but below target, so it does not count today.');
  },
  untick(d) { saveWeek(curWeek(), { days: { [gameDay(now())]: { ticks: { [d.g]: null } } } }); },
  close() {
    const w = curWeek(), t = now(), day = gameDay(t), st = dayOf(S.me, w, day, t); if (st.s !== 'open') return;
    const audit = auditPick(S.me, day, st.hits), g = eff(S.me, w).find(x => x.id === audit);
    saveWeek(w, { days: { [day]: { closed: t, audit } } }); toast('Spot check: ' + (g ? g.title : '') + '. Upload one image.'); window.scrollTo(0, 0);
  },
  auth(d) { S.auth = d.v; render(true); },
  signout() { signOut(false); },
  retry() { S.mode = 'loading'; sync(); },
  rej(d) { S.rejecting = d.id || null; render(true); },
  rv(d) { S.rejecting = null; saveWeek(d.key.startsWith('g_') ? curWeek() : d.w, { reviews: { [d.u + '__' + d.key]: { v: +d.v, r: d.r || null, n: +d.n, t: now() } } }); toast(+d.v ? 'Approved.' : 'Rejected. Two approvals from others can overturn it.'); },
  copy(d) {
    const w = d.w, t = now(), st = board(w, t);
    const text = ['YUZU · Week ' + seasonOf(w, startW()).week + (t >= weekFinal(w) ? ' final' : t >= weekShow(w) ? ' (provisional)' : ' so far')].concat(st.rows.map(r => r.rank + '. ' + name(r.u) + ' ' + r.pts)).join('\n');
    try { navigator.clipboard.writeText(text).then(() => toast('Standings copied. Paste them in the flat chat.'), () => toast('Copy was blocked on this device.')); } catch (e) { toast('Copy was blocked on this device.'); }
  }
};
const AUTH_ERR = { BAD_CODE: "That invite code isn't right.", BAD_PHONE: 'Check the phone number.', BAD_PIN: 'The PIN must be exactly 6 digits.', BAD_NAME: 'Add a name of 2 to 20 characters.', PHONE_TAKEN: 'That number has already joined. Use Sign in.', NAME_TAKEN: 'That name is already in the league. Add an initial.', FULL: 'This league is full.', BAD_LOGIN: "That number and PIN don't match.", LOCKED: 'Too many wrong PINs. Try again in 15 minutes.', offline: "You're offline. Check your connection." };
const forms = {
  async auth() {
    const join = S.auth === 'join', err = m => { $('authErr').textContent = m; }, phone = normPhone($('a_phone').value), pin = $('a_pin').value.trim();
    if (!phone) return err('Enter your mobile number, for example 07700 900123.');
    if (!/^[0-9]{6}$/.test(pin)) return err('The PIN must be exactly 6 digits.');
    const btn = $('authGo'); btn.disabled = true; err('');
    try {
      const j = join ? await rpc('yz_join', { p_phone: phone, p_pin: pin, p_name: $('a_name').value, p_code: $('a_code').value, p_week: curWeek() }) : await rpc('yz_login', { p_phone: phone, p_pin: pin });
      token = j.token; try { localStorage.setItem('yuzu_token', token); } catch (e) {}
      const nick = join ? $('a_name').value.trim().replace(/\s+/g, ' ') : '';
      clearDraft('a_'); S.me = j.uid; S.mode = 'loading'; $('view').innerHTML = joinCard(); await sync();
      S.enter = true; render(true);
      if (join) celebrate("You're locked in to Yuzu, " + nick + '.');
    } catch (e) { if ($('authGo')) $('authGo').disabled = false; if ($('authErr')) err(AUTH_ERR[e.code] || "Couldn't reach Yuzu. Try again in a moment."); }
  },
  join() { const nick = nickOk(); if (!nick) return; clearDraft('nick'); saveProfile({ joined: now(), nick }); if (!S.config.seasonStart) saveConfig({ seasonStart: curWeek() }); },
  rename() { const nick = nickOk(); if (!nick) return; S.rename = false; clearDraft('nick'); saveProfile({ nick }); toast('Name saved.'); },
  goal() {
    const v = id => { const el = $(id); return el ? el.value.trim() : ''; }, e = S.edit, t = now(), goals = clone(eff(S.me, curWeek())), p = e.i >= 0 ? goals[e.i] : null, type = e.g.type;
    const err = m => { $('goalErr').textContent = m; };
    const title = v('e_t'), proof = v('e_p'), ml = v('e_ml'), mt = parseFloat(v('e_mt'));
    if (!title || !proof) return err('Add the goal and how you will prove it.');
    const g = { id: p ? p.id : rid(), type, title, cat: v('e_c'), proof, m: null, n: 1, at: t };
    if (type === 'w') { g.std = v('e_s'); g.str = v('e_x'); if (!g.std) return err('Add a Standard target.'); }
    if (type === 's') {
      g.base = parseFloat(v('e_b')); g.target = parseFloat(v('e_g')); g.unit = v('e_u'); g.sid = seasonInfo().id;
      if (isNaN(g.base) || isNaN(g.target) || g.base === g.target) return err('Add where you are now and a different target, both as numbers.');
    } else {
      if ((ml && isNaN(mt)) || (!ml && v('e_mt'))) return err('A typed number needs both a name and a target, or leave both empty.');
      if (ml) g.m = { l: ml, u: v('e_mu'), t: mt, op: v('e_mo') === 'max' ? 'max' : 'min' };
      g.up = v('e_up') || null;
    }
    if (p) { const same = ['title', 'cat', 'proof', 'std', 'str', 'base', 'target', 'unit', 'sid', 'up'].every(k => String(p[k] == null ? '' : p[k]) === String(g[k] == null ? '' : g[k])) && JSON.stringify(p.m || null) === JSON.stringify(g.m); g.n = same ? p.n || 1 : (p.n || 1) + 1; g.at = same ? p.at || t : t; goals[e.i] = g; } else goals.push(g);
    S.edit = null; clearDraft('e_');
    saveGoals(goals); toast('Goal saved. Your ref will sign it off.');
  }
};
document.addEventListener('click', e => {
  const z = e.target.closest('img[data-zoom]');
  if (z) { $('zoomImg').src = z.src; $('zoom').classList.add('on'); return; }
  const lab = e.target.closest('label[data-up]');
  if (lab) { const g = eff(S.me, curWeek()).find(x => x.id === lab.dataset.up); if (g && (g.m || g.type === 's') && isNaN(parseFloat(($('v_' + g.id) || {}).value))) { e.preventDefault(); toast(g.type === 's' ? "Type this week's result first." : 'Type your ' + g.m.l.toLowerCase() + ' number first.'); } return; }
  const b = e.target.closest('[data-act]'); if (b && acts[b.dataset.act]) acts[b.dataset.act](b.dataset, b);
});
$('zoom').addEventListener('click', () => $('zoom').classList.remove('on'));
document.addEventListener('submit', e => { e.preventDefault(); const f = forms[e.target.dataset.form]; if (f) f(e.target); });
document.addEventListener('error', e => { const t = e.target; if (t && t.tagName === 'IMG' && t.dataset.zoom !== undefined) { const d = document.createElement('div'); d.className = t.className + ' ph'; d.textContent = 'Photo unavailable'; t.replaceWith(d); } }, true);
document.addEventListener('change', async e => {
  const el = e.target; if (el.type !== 'file' || !(el.dataset.key || el.dataset.day)) return;
  const file = el.files && el.files[0]; if (!file) return;
  if (!/^image\//.test(file.type)) return toast('That file is not an image. Choose a photo or a screenshot.');
  if (el.dataset.day) {
    const w = curWeek(), day = el.dataset.day, rec = ((myWeek(w) || {}).days || {})[day]; if (!rec || !rec.closed) return;
    const n = (rec.n || 0) + 1, before = myRow(w, now());
    S.busy = 'day'; render(true);
    try {
      const ref = await storePhoto(file, w + '_day_' + day + '_' + n);
      S.busy = null;
      const ok = await saveWeek(w, { days: { [day]: { n, t: now(), a: ref.a, ph: ref.ph, re: el.dataset.re || rec.re ? 1 : null } } });
      if (ok) { const after = myRow(w, now()); celebrate('Day counted. You\'re on ' + after.pts + '.' + (after.rank && after.rank < before.rank ? ' Up to ' + ord(after.rank) + '.' : '')); }
    } catch (err) { S.busy = null; render(true); toast(err && err.code ? "Couldn't save the image. You may have view-only access." : "Couldn't read that image. Try a screenshot or a JPEG."); }
    return;
  }
  const d = el.dataset, gg = eff(S.me, curWeek()).find(x => x.id === d.g); if (!gg) return;
  const p = { key: d.key, gid: gg.id, lvl: d.lvl || null, re: !!d.re, w: curWeek(), keep: !!d.keep, v: null };
  if ((gg.m || gg.type === 's') && !p.keep) { p.v = parseFloat(($('v_' + gg.id) || {}).value); if (isNaN(p.v)) return toast('Type the number first, then choose the image.'); }
  const w = p.w, wk = myWeek(w) || {}, g = eff(S.me, w).find(x => x.id === p.gid), old = (wk.checkins || {})[p.key], n = (old ? old.n : 0) + 1, before = myRow(w, now());
  S.busy = p.key; render(true);
  try {
    const ref = await storePhoto(file, w + '_' + p.key + '_' + n);
    const c = { t: now(), n, a: ref.a, ph: ref.ph, lvl: p.lvl, re: p.re || (old && old.re) ? 1 : null, v: p.keep ? (old && typeof old.v === 'number' ? old.v : null) : p.v };
    S.busy = null; clearDraft('v_' + p.gid);
    const ok = await saveWeek(w, pinned(w, { checkins: { [p.key]: c } }));
    if (!ok) return;
    const after = myRow(w, now());
    toast(!met(g, c) ? 'Logged. Below target, so it scores nothing.' : 'Counted. You\'re on ' + after.pts + '.' + (after.rank && after.rank < before.rank ? ' Up to ' + ord(after.rank) + '.' : ''));
  } catch (err) { S.busy = null; render(true); toast(err && err.code ? "Couldn't save the photo. You may have view-only access." : "Couldn't read that image. Try a screenshot or a JPEG."); }
});

/* ---------- sample data: shown in previews and when the league can't be reached ---------- */
function sample(why) {
  S.mode = 'sample'; S.why = why || ''; db = null; S.me = 'you';
  const t = now(), cw = curWeek(), pw = addDays(cw, -7), today = gameDay(t);
  const ppl = [['maya', 'Maya', .97, 'Hit my protein', 'Athletic', 'Read 20 pages', 'Life', 'Sketch one page', 'Creative', '5k time', 'Athletic', 'min', 27.5, 25, 26.9], ['sam', 'Sam', .4, '10,000 steps', 'Athletic', '1 hour on the business', 'Business', 'Cook for the flat', 'Flat', 'Monthly revenue', 'Business', '£', 400, 1000, 430], ['priya', 'Priya', .8, '2 hours of focused study', 'Academic', '10,000 steps', 'Athletic', 'Finish a timed past paper', 'Academic', 'Past paper score', 'Academic', '%', 54, 65, 57], ['tom', 'Tom', .65, '30 minutes of practice', 'Creative', 'Hit my protein', 'Athletic', 'Record one full take', 'Creative', 'Songs finished', 'Creative', '', 0, 4, 1], ['leila', 'Leila', .85, 'Read 20 pages', 'Life', '2 hours of focused study', 'Academic', 'Finish the lab report', 'Academic', 'Bench press', 'Athletic', 'kg', 50, 60, 52.5], ['you', 'You', .75, 'Hit my protein', 'Athletic', '2 hours of focused study', 'Academic', 'Write 500 words', 'Creative', 'Past paper score', 'Academic', '%', 58, 70, 61]];
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const pm = title => title === 'Hit my protein' ? { l: 'Protein', u: 'g', t: 150, op: 'min' } : null;
  S.config = { seasonStart: pw };
  for (const [u, nm, f, a, ac, b, bc, wkT, wc, sT, sc, unit, base, target, cur] of ppl) {
    S.profiles[u] = { name: nm }; S.players[u] = { joined: at(pw, 9) }; S.weeks[u] = {};
    const goals = [{ id: 'a', type: 'd', title: a, cat: ac, proof: 'Screenshot', m: pm(a), n: 1, at: at(pw, 9) }, { id: 'b', type: 'd', title: b, cat: bc, proof: 'Photo', m: pm(b), n: 1, at: at(pw, 9) }, { id: 'c', type: 'w', title: wkT, cat: wc, proof: 'Photo of the result', std: 'Done once', str: 'Done with a personal best', m: null, n: 1, at: at(pw, 9) }, { id: 's', type: 's', title: sT, cat: sc, proof: 'Photo of the result', base, target, unit, sid: pw, m: null, n: 1, at: at(pw, 9) }];
    goals.slice(0, 3).forEach(g => { if (g.cat === sc) g.up = 's'; });
    for (const w of [pw, cw]) {
      const cs = {};
      const ds = {};
      for (const d of weekDays(w)) {
        if (d > today || (d === today && u === 'you')) continue;
        const ticks = {}; for (const g of goals.slice(0, 2)) if (rnd() < f) ticks[g.id] = g.m ? 150 + Math.round(rnd() * 24) : true;
        const ids = Object.keys(ticks), tt = d === today ? t - 20 * 60000 : at(d, 21);
        if (ids.length && tt <= t) ds[d] = { ticks, closed: tt, audit: auditPick(u, d, ids), n: 1, t: tt, ph: 1 };
      }
      if (w === pw) { if (f > .5) cs.c_w = { n: 1, t: at(addDays(w, 5), 15), lvl: f > .8 ? 's' : 'n' }; cs.s_w = { n: 1, t: at(addDays(w, 6), 11), v: cur }; }
      S.weeks[u][w] = w === pw ? { goals, lockedAt: at(pw, 9), days: ds, checkins: cs, reviews: {} } : { days: ds, checkins: cs, reviews: {} };
    }
  }
  S.weeks.priya[cw].reviews = { maya__a_x: { v: 1, n: 1, t }, tom__a_x: { v: 1, n: 1, t }, sam__a_x: { v: 1, n: 1, t } };
  render(true);
}

function init() {
  if (!/^https?:/.test(CFG.url)) return sample();
  if (!token) { S.mode = 'auth'; return render(true); }
  sync();
}
init();
