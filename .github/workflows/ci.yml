name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: scoring and review rules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Unit tests
        run: node tests/core.test.js
      - name: Build
        run: ./build.sh
